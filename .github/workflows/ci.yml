name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-nanomsg-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc mingw-w64-i686-binutils
      - name: Add MinGW32 to PATH
        shell: pwsh
        run: |
          $bin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw32\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Build thinBasic_NanoMsg.dll
        shell: cmd
        run: ThinBasicNanoMsg\SDK\C\build_mingw_ci.bat
      - uses: actions/upload-artifact@v4
        with:
          name: thinBasic_NanoMsg-x86
          path: ThinBasicNanoMsg/SDK/C/bin/thinBasic_NanoMsg.dll
          if-no-files-found: error

  build-nng-sdk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW32
          update: false
          install: mingw-w64-i686-gcc mingw-w64-i686-binutils
      - name: Add MinGW32 to PATH
        shell: pwsh
        run: |
          $bin = Join-Path "${{ steps.msys2.outputs.msys2-location }}" "mingw32\bin"
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Build thinBasic_NNG.dll
        shell: cmd
        run: ThinBasicNNG\SDK\C\build_mingw_ci.bat
      - uses: actions/upload-artifact@v4
        with:
          name: thinBasic_NNG-x86
          path: ThinBasicNNG/SDK/C/bin/thinBasic_NNG.dll
          if-no-files-found: error
